server:
  port: 8082
spring:
  application:
    name: ops-starter
  datasource:
    url: jdbc:mysql://localhost:3306/ops_pilot?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
    username: root
    password: ${DB_PASSWORD}
  config:
    import:
      - optional:nacos:OpsPilot-starter?group=application
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: public
        group: DEFAULT_GROUP
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}

