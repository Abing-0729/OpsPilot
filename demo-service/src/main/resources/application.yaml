server:
  port: 8081

spring:
  application:
    name: demo-service
  config:
    import:
      - optional:nacos:OpsPilot-starter?group=application
  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.endpoint.NacosConfigEndpointAutoConfiguration
      - com.alibaba.cloud.nacos.endpoint.NacosDiscoveryEndpointAutoConfiguration
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: public
        group: DEFAULT_GROUP
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
  datasource:
    url: jdbc:mysql://localhost:3306/ops_pilot?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: never
logging:
  level:
    com.orders: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %5level [%thread] [traceId=%X{traceId}] %logger{20} - %msg%n"
