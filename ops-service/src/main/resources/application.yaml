server:
  port: 8083

spring:
  application:
    name: ops-service
  config:
    import:
      - optional:nacos:OpsPilot-starter?group=application
  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.endpoint.NacosConfigEndpointAutoConfiguration
      - com.alibaba.cloud.nacos.endpoint.NacosDiscoveryEndpointAutoConfiguration
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: public
        group: DEFAULT_GROUP
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
    openfeign:
      client:
        config:
          default:
            connect-timeout: 500
            read-timeout: 1000
  datasource:
    url: jdbc:mysql://localhost:3306/ops_pilot?useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5level [%thread] [traceId=%X{traceId}] %logger{20} - %msg%n"

# 熔断器配置：5 次调用的滑动窗口，失败率 ≥60% 即开门；
# 开门 15 秒后放 2 次探测请求（半开），成功则关门恢复
resilience4j:
  circuitbreaker:
    instances:
      demoService:
        sliding-window-size: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true